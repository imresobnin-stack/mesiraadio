<style>
:root{
  --page-bg:#FFC933;
  --honey:#FFC933;
  --honey-deep:#F5B71E;
  --honey-pale:#FFE08A;
  --ink:#241B04;
  --ink-soft:#6B5B2A;
  --paper:#FFFFFF;
  --cream:#FFF8E4;
  --leaf:#5E9C52;
  --leaf-deep:#3F7A36;
  --berry:#E4573D;
  --shadow:0 6px 0 rgba(36,27,4,.14);
  --radius:22px;
}
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{
  font-family:'Nunito',sans-serif;
  background:var(--page-bg);
  color:var(--ink);
  min-height:100vh;
  padding-bottom:150px;
  transition:background .3s ease, color .3s ease;
}
h1,h2,h3,.btn,.chip{font-family:'Baloo 2',cursive}


/* ---------- päis ---------- */
header{position:relative;z-index:2;padding:26px 20px 6px;max-width:960px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-family:'Baloo 2',cursive;font-weight:800;font-size:1.5rem;letter-spacing:.02em}
.logo svg{width:44px;height:44px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 0 4px}
.hero-art{width:min(320px,72vw);height:auto;filter:drop-shadow(0 10px 0 rgba(36,27,4,.10))}
.hero h1{font-size:clamp(1.7rem,5vw,2.5rem);font-weight:800;line-height:1.1;margin-top:6px}
.hero p{color:var(--ink-soft);font-weight:700;margin-top:4px}

/* ---------- otsing ---------- */
.search-wrap{position:relative;z-index:2;max-width:560px;margin:18px auto 0;padding:0 20px;display:flex;gap:10px;align-items:center}
.search{flex:1}
.dice-btn{
  flex:none;width:52px;height:52px;border-radius:50%;border:3px solid var(--ink);
  background:var(--paper);color:var(--ink);cursor:pointer;display:grid;place-items:center;
  box-shadow:0 5px 0 rgba(0,0,0,.18);transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
}
.dice-btn svg{width:26px;height:26px}
.dice-btn:hover{transform:translateY(-2px) rotate(-12deg);background:var(--honey-pale)}
.dice-btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.dice-btn:focus-visible{outline:4px solid var(--leaf);outline-offset:2px}
@keyframes diceroll{0%{transform:rotate(0)}40%{transform:rotate(200deg) scale(1.15)}100%{transform:rotate(360deg)}}
.dice-btn.rolling svg{animation:diceroll .5s ease}
@media (prefers-reduced-motion:reduce){.dice-btn.rolling svg{animation:none}}
.search{
  display:flex;align-items:center;gap:10px;background:var(--paper);
  border:3px solid var(--ink);border-radius:999px;padding:12px 18px;box-shadow:var(--shadow);
}
.search input{border:0;outline:0;flex:1;font:inherit;font-weight:700;color:var(--ink);background:transparent}
.search input::placeholder{color:#B4A76E}
.search svg{flex:none}

/* ---------- sektsioonid ---------- */
main{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:22px 20px 0}
.section-head{display:flex;align-items:center;gap:10px;margin:22px 0 12px}
.section-head h2{font-size:1.25rem;font-weight:800}
.count-pill{background:var(--ink);color:var(--page-bg);font-family:'Baloo 2',cursive;font-weight:700;font-size:.8rem;border-radius:999px;padding:2px 12px}

/* ---------- kaardid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{
  position:relative;display:flex;align-items:center;gap:12px;
  background:var(--paper);border:3px solid var(--ink);border-radius:var(--radius);
  padding:14px 14px 14px 14px;cursor:pointer;box-shadow:var(--shadow);
  transition:transform .12s ease, box-shadow .12s ease;
  text-align:left;width:100%;
  min-width:0;
  color:var(--ink);font-family:inherit;
}
.card > span{min-width:0}
.card .name,.card .meta{overflow-wrap:anywhere}
.card:hover{transform:translateY(-3px);box-shadow:0 9px 0 rgba(36,27,4,.14)}
.card:active{transform:translateY(1px);box-shadow:0 3px 0 rgba(36,27,4,.14)}
.card:focus-visible{outline:4px solid var(--leaf);outline-offset:2px}
.badge{
  flex:none;width:46px;height:46px;border-radius:14px;border:3px solid var(--ink);
  display:grid;place-items:center;
}
.badge svg{width:28px;height:28px}
.card .name{font-weight:800;font-size:.98rem;line-height:1.2;padding-right:30px}
.card.playing{background:var(--ink);color:var(--honey)}
.card.playing .name{color:var(--honey)}
.card.playing .badge{border-color:var(--honey)}
.eq{display:none;gap:3px;align-items:flex-end;height:14px;margin-top:3px}
.card.playing .eq{display:inline-flex}
.eq span{width:4px;background:var(--honey);border-radius:2px;animation:eq 1s ease-in-out infinite}
.eq span:nth-child(2){animation-delay:.2s}
.eq span:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:5px}50%{height:14px}}
@media (prefers-reduced-motion:reduce){.eq span{animation:none;height:9px}}

/* süda */
.fav-btn{
  position:absolute;top:10px;right:10px;width:34px;height:34px;border:0;background:transparent;
  cursor:pointer;display:grid;place-items:center;border-radius:50%;
}
.fav-btn:focus-visible{outline:3px solid var(--leaf)}
.fav-btn svg{width:22px;height:22px;transition:transform .15s ease}
.fav-btn:hover svg{transform:scale(1.2)}
.fav-btn .heart{fill:none;stroke:var(--ink);stroke-width:2.4}
.card.playing .fav-btn .heart{stroke:var(--honey)}
.fav-btn.on .heart{fill:var(--berry);stroke:var(--berry)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
.fav-btn.on svg{animation:pop .3s ease}
@media (prefers-reduced-motion:reduce){.fav-btn.on svg{animation:none}}

/* ---------- pleier ---------- */
.player{
  position:fixed;left:0;right:0;bottom:0;z-index:10;
  background:var(--paper);border-top:3px solid var(--ink);
  border-radius:28px 28px 0 0;box-shadow:0 -8px 0 rgba(36,27,4,.10);
  transform:translateY(110%);transition:transform .3s ease;
}
.player.open{transform:translateY(0)}
@media (prefers-reduced-motion:reduce){.player{transition:none}}
.player-inner{max-width:960px;margin:0 auto;padding:14px 20px 18px;display:flex;align-items:center;gap:16px}
.player .handle{width:52px;height:5px;border-radius:99px;background:rgba(36,27,4,.18);position:absolute;top:8px;left:50%;transform:translateX(-50%)}
.now{flex:1;min-width:0}
.now .label{font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.now .title{font-family:'Baloo 2',cursive;font-weight:800;font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now .status{font-size:.8rem;font-weight:700;color:var(--leaf-deep)}
.now .status.err{color:var(--berry)}
.now .track{
  font-size:.85rem;font-weight:700;color:var(--ink-soft);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;
}
.now .track::before{content:'♪ ';color:var(--honey-deep)}
.play-btn{
  flex:none;width:64px;height:64px;border-radius:50%;border:3px solid var(--ink);
  background:var(--honey);cursor:pointer;display:grid;place-items:center;
  box-shadow:0 5px 0 rgba(36,27,4,.2);transition:transform .1s ease;
}
.play-btn:hover{background:var(--honey-deep)}
.play-btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(36,27,4,.2)}
.play-btn:focus-visible{outline:4px solid var(--leaf);outline-offset:3px}
.vol{display:flex;align-items:center;gap:8px}
.vol{position:relative}
.vol input[type=range]{width:110px;accent-color:var(--ink)}
.vol-pct{
  position:absolute;top:-34px;left:50%;transform:translateX(-50%) translateY(4px);
  background:var(--ink);color:var(--paper);font-family:'Baloo 2',cursive;font-weight:700;
  font-size:.78rem;padding:3px 10px;border-radius:999px;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .18s ease, transform .18s ease;
}
.vol-pct.show{opacity:1;transform:translateX(-50%) translateY(0)}
.player .fav-btn{position:static;flex:none}
@media (max-width:560px){
  .vol{display:none}
  .player-inner{gap:12px}
}

/* spinner */
.spin{width:20px;height:20px;border:3px solid rgba(36,27,4,.2);border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite;display:none}
.player.loading .spin{display:block}
.player.loading .play-icon{display:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- nupud ---------- */
.btn{
  border:3px solid var(--ink);border-radius:999px;background:var(--honey);
  color:var(--ink);font-weight:700;font-size:.9rem;padding:8px 18px;cursor:pointer;
  box-shadow:0 4px 0 rgba(36,27,4,.2);transition:transform .1s ease;
}
.btn:hover{background:var(--honey-deep)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(36,27,4,.2)}
.btn:focus-visible{outline:4px solid var(--leaf);outline-offset:2px}
.btn.ghost{background:var(--paper)}
.btn.ghost:hover{background:var(--cream)}
.add-btn{margin-left:auto;background:var(--paper)}
.add-btn:hover{background:var(--honey)}

/* ---------- oma kanali kaart ---------- */
.card.custom{background:var(--cream)}
.card.custom.playing{background:var(--ink)}
.del-btn{
  position:absolute;top:10px;right:44px;width:34px;height:34px;border:0;background:transparent;
  cursor:pointer;display:grid;place-items:center;border-radius:50%;
}
.del-btn:focus-visible{outline:3px solid var(--berry)}
.del-btn svg{width:18px;height:18px;transition:transform .15s ease}
.del-btn:hover svg{transform:scale(1.2)}
.del-btn path{stroke:var(--ink-soft);stroke-width:2.4;stroke-linecap:round}
.del-btn:hover path{stroke:var(--berry)}
.card.playing .del-btn path{stroke:var(--honey)}
.card.custom .name{padding-right:64px}

/* ---------- modaal ---------- */
.modal-back{
  position:fixed;inset:0;z-index:20;background:rgba(36,27,4,.45);
  display:grid;place-items:center;padding:20px;
}
.modal-back[hidden]{display:none}
.modal{
  background:var(--paper);border:3px solid var(--ink);border-radius:26px;
  box-shadow:0 8px 0 rgba(36,27,4,.25);width:min(440px,100%);padding:26px 24px 22px;
}
.modal h3{font-size:1.35rem;font-weight:800;margin-bottom:14px}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:5px}
.field input{
  width:100%;font:inherit;font-weight:700;color:var(--ink);
  border:3px solid var(--ink);border-radius:14px;padding:10px 14px;background:var(--cream);outline:0;
}
.field input:focus-visible{border-color:var(--leaf);background:var(--paper)}
.modal-err{color:var(--berry);font-weight:700;font-size:.85rem;min-height:1.2em;margin-bottom:8px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px}

footer{position:relative;z-index:1;text-align:center;padding:34px 20px 10px;color:var(--ink-soft);font-weight:700;font-size:.85rem}

/* ---------- mobiil ---------- */
@media (max-width:680px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .card{flex-direction:column;align-items:flex-start;gap:8px;padding:12px;border-radius:18px}
  .badge{width:40px;height:40px;font-size:.95rem;border-radius:12px}
  .card .name{font-size:.88rem;padding-right:0}
  .card.custom .name{padding-right:0}
  .fav-btn{top:8px;right:8px}
  .del-btn{top:8px;right:42px}
  header{padding:18px 14px 4px}
  main{padding:16px 14px 0}
  .search-wrap{padding:0 14px}
  .search{padding:10px 14px}
  .logo{font-size:1.25rem}
  .logo svg{width:36px;height:36px}
  .section-head{flex-wrap:wrap;row-gap:8px}
  .add-btn{padding:7px 14px;font-size:.85rem}
  .hero-art{width:min(250px,64vw)}
  .hero p{font-size:.9rem;padding:0 6px}
  .player-inner{padding:14px 14px 16px}
  .play-btn{width:56px;height:56px}
  .now .title{font-size:1rem}
  .modal{padding:20px 16px 16px;border-radius:20px}
  body{padding-bottom:130px}
}
@media (max-width:380px){
  .grid{grid-template-columns:1fr 1fr}
}
footer a{color:inherit}
body.dark{
  --page-bg:#211A06; --paper:#332908; --cream:#3E320C;
  --ink:#FFF3C9; --ink-soft:#C9B77A; --honey-pale:#4A3B0E;
}
/* tume režiim: erijuhud */
body.dark .card.playing{background:var(--honey);color:#241B04}
body.dark .card.playing .name,body.dark .card.playing .meta{color:#241B04}
body.dark .card.playing .eq span{background:#241B04}
body.dark .card.playing .badge{border-color:#241B04}
body.dark .card.playing .fav-btn .heart{stroke:#241B04}
body.dark .card.playing .del-btn path{stroke:#241B04}
body.dark .hero-art > circle:nth-of-type(1){fill:var(--cream)}
body.dark .hero-art > circle:nth-of-type(2){fill:var(--honey-pale)}
.theme-btn{
  flex:none;width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);
  background:var(--paper);color:var(--ink);cursor:pointer;display:grid;place-items:center;
  box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .12s ease;
}
.theme-btn svg{width:24px;height:24px}
.theme-btn:hover{transform:translateY(-2px);background:var(--cream)}
.theme-btn:active{transform:translateY(1px)}
.theme-btn:focus-visible{outline:4px solid var(--leaf);outline-offset:2px}
.badge{border-color:#241B04!important}



/* ================= HERO: tants & uni ================= */
#bee{transform-origin:150px 185px;transition:transform .8s ease}
body.dancing #bee{animation:hero-rock 1.1s ease-in-out infinite}
@keyframes hero-rock{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
#wing-l{transform-origin:120px 86px}
#wing-r{transform-origin:180px 86px}
body.dancing #wing-l{animation:flapL .22s ease-in-out infinite alternate}
body.dancing #wing-r{animation:flapR .22s ease-in-out infinite alternate}
@keyframes flapL{from{transform:rotate(4deg)}to{transform:rotate(-18deg)}}
@keyframes flapR{from{transform:rotate(-4deg)}to{transform:rotate(18deg)}}
#head-g{transform-origin:150px 80px}
body.dancing #head-g{animation:hero-bob .55s ease-in-out infinite alternate}
@keyframes hero-bob{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.note{opacity:0}
body.dancing .note{animation:noteFloat 1.6s ease-out infinite}
body.dancing .note.n2{animation-delay:.55s}
body.dancing .note.n3{animation-delay:1.1s}
@keyframes noteFloat{0%{opacity:0;transform:translateY(6px)}25%{opacity:.8}100%{opacity:0;transform:translateY(-26px)}}
body.sleeping #bee{transform:translateY(10px) rotate(-6deg)}
body.sleeping #wing-l,body.sleeping #wing-r{transition:transform .8s ease .3s}
body.sleeping #wing-l{transform:rotate(14deg)}
body.sleeping #wing-r{transform:rotate(-14deg)}
#eyes-closed{opacity:0}
#eyes-open,#eyes-closed{transition:opacity .25s ease .6s}
body.sleeping #eyes-open{opacity:0}
body.sleeping #eyes-closed{opacity:1}
body:not(.sleeping) #eyes-open,body:not(.sleeping) #eyes-closed{transition-delay:0s}
#mouth-sleep{opacity:0}
#mouth-smile,#mouth-sleep{transition:opacity .25s ease .6s}
body.sleeping #mouth-smile{opacity:0}
body.sleeping #mouth-sleep{opacity:1}
.zzz{opacity:0}
body.sleeping .zzz{animation:zfloat 2.4s ease-out infinite}
body.sleeping .zzz.z1{animation-delay:.9s}
body.sleeping .zzz.z2{animation-delay:1.7s}
body.sleeping .zzz.z3{animation-delay:2.5s}
@keyframes zfloat{0%{opacity:0;transform:translate(0,4px) scale(.7)}20%{opacity:1}100%{opacity:0;transform:translate(14px,-30px) scale(1.15)}}
body.dark .note,body.dark .zzz{fill:var(--ink)}
body.dark .note path{stroke:var(--ink)}
@media (prefers-reduced-motion:reduce){
  body.dancing #bee,body.dancing #wing-l,body.dancing #wing-r,body.dancing #head-g,
  body.dancing .note,body.sleeping .zzz{animation:none}
  #bee,#wing-l,#wing-r{transition:none}
}

/* ================= ÜLLATUSMUNAD ================= */
#eyes-angry,#eyes-dizzy,#mouth-angry{opacity:0}
.hero-art{cursor:pointer}
/* klikireaktsioonid (svg-l, ei sega sisemisi tantsuanimatsioone) */
.hero-art.react-spin{animation:reactSpin .65s ease}
.hero-art.react-wave{animation:reactWave .6s ease}
.hero-art.react-bow{animation:reactBow .7s ease}
@keyframes reactSpin{to{transform:rotate(360deg)}}
@keyframes reactWave{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}75%{transform:rotate(-6deg)}}
@keyframes reactBow{0%,100%{transform:rotate(0)}40%{transform:rotate(14deg) translateY(6px)}}
/* õis hüppab (kaktus) */
#flower.jump{animation:flowerJump .7s cubic-bezier(.3,1.6,.5,1)!important}
@keyframes flowerJump{0%,100%{transform:translateY(0)}45%{transform:translateY(-34px) rotate(12deg)}}
/* vihane (5 kiiret klikki) */
body.angry #eyes-open,body.angry #eyes-closed,body.angry #eyes-dizzy{opacity:0!important}
body.angry #mouth-smile,body.angry #mouth-sleep{opacity:0!important}
body.angry #eyes-angry,body.angry #mouth-angry{opacity:1!important}
body.angry .hero-art{animation:angryShake .3s ease 3}
@keyframes angryShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
/* pöörissilmad (täringu ülekuumenemine) */
body.dizzy #eyes-open,body.dizzy #eyes-closed,body.dizzy #eyes-angry{opacity:0!important}
body.dizzy #eyes-dizzy{opacity:1!important}
body.dizzy #head-g{animation:dizzyWobble .8s ease-in-out infinite!important}
@keyframes dizzyWobble{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.dice-btn.hot{background:#E4573D!important;border-color:#8a2413!important;color:#fff!important;animation:hotShake .25s ease infinite}
@keyframes hotShake{0%,100%{transform:translate(0)}25%{transform:translate(-2px,1px)}75%{transform:translate(2px,-1px)}}
/* striimiviga: kehitab õlgu */
body.oops .hero-art{animation:shrug .7s ease 2}
@keyframes shrug{0%,100%{transform:rotate(0) translateY(0)}30%{transform:rotate(-4deg) translateY(-5px)}60%{transform:rotate(4deg) translateY(-5px)}}
body.oops #mouth-smile{opacity:0!important}
body.oops #mouth-sleep{opacity:1!important}
/* disko */
body.disco header,body.disco main{animation:discoHue 5s linear infinite}
@keyframes discoHue{to{filter:hue-rotate(360deg)}}
body.disco.dancing #bee{animation-duration:.45s}
body.disco body.disco #wing-l{animation-duration:.12s}body.disco #wing-r{animation-duration:.12s}
/* jõulud */
#scarf{opacity:0;transition:opacity .5s ease}
body.xmas #scarf{opacity:1}
body.nighttime.dancing #bee{animation-duration:2.2s}
body.nighttime.dancing #wing-l,body.nighttime.dancing #wing-r{animation-duration:.44s}
body.nighttime.dancing #head-g{animation-duration:1.1s}
/* lendavad elemendid */
.snowflake{position:fixed;top:-24px;color:#fff;pointer-events:none;z-index:6;animation:snowfall linear forwards;text-shadow:0 0 4px rgba(0,0,0,.15)}
@keyframes snowfall{to{transform:translateY(110vh) rotate(240deg)}}
.honeydrop{position:fixed;top:-30px;width:14px;height:20px;background:#F5B71E;border:2.5px solid #241B04;border-radius:50% 50% 60% 60%/40% 40% 70% 70%;pointer-events:none;z-index:6;animation:dropfall 2.2s ease-in forwards}
@keyframes dropfall{to{transform:translateY(112vh)}}
.antrow{position:fixed;bottom:4px;left:0;pointer-events:none;z-index:6;font-size:18px;letter-spacing:10px;white-space:nowrap;animation:antwalk 8s linear forwards}
@keyframes antwalk{from{transform:translateX(-40vw)}to{transform:translateX(110vw)}}
.confetti-p{position:fixed;width:9px;height:9px;pointer-events:none;z-index:6;animation:confall ease-in forwards}
@keyframes confall{to{transform:translateY(60vh) rotate(600deg);opacity:0}}
.smoke{position:fixed;width:16px;height:16px;border-radius:50%;background:rgba(120,120,120,.55);pointer-events:none;z-index:20;animation:smokerise 1.2s ease-out forwards}
@keyframes smokerise{to{transform:translateY(-46px) scale(2.2);opacity:0}}
@media (prefers-reduced-motion:reduce){
  .hero-art.react-spin,.hero-art.react-wave,.hero-art.react-bow,body.angry .hero-art,
  body.dizzy #head-g,body.oops .hero-art,body.disco header,body.disco main,
  .snowflake,.honeydrop,.antrow,.confetti-p,.smoke,.dice-btn.hot{animation:none}
}

/* ================= SILMAD, ŽANRITANTS, UNI+ ================= */
#eyes-open{transition:transform .12s ease-out}
/* žanritantsud */
body.dancing.dance-rock #head-g{animation:headbang .38s ease-in-out infinite}
@keyframes headbang{0%,100%{transform:rotate(3deg)}50%{transform:rotate(-15deg)}}
body.dancing.dance-classical #wing-l{animation:conductL 1.5s ease-in-out infinite}
body.dancing.dance-classical #wing-r{animation:conductR 1.5s ease-in-out infinite}
@keyframes conductL{0%,100%{transform:rotate(8deg)}50%{transform:rotate(-34deg)}}
@keyframes conductR{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(34deg)}}
body.dancing.dance-classical #head-g{animation-duration:1.5s}
body.dancing.dance-classical #bee{animation-duration:2.4s}
body.dancing.dance-electronic #bee,
body.dancing.dance-electronic #head-g,
body.dancing.dance-electronic #wing-l,
body.dancing.dance-electronic #wing-r{animation-timing-function:steps(2,end)}
body.dancing.dance-folk #bee{animation:folkSway 1.7s ease-in-out infinite}
@keyframes folkSway{0%,100%{transform:rotate(-6deg) translateX(-5px)}50%{transform:rotate(6deg) translateX(5px)}}
body.dancing.dance-folk #head-g{animation-duration:1.7s}
/* sügav uni: suurem Zzz, sügavam norg */
body.deep-sleep #bee{transform:translateY(18px) rotate(-11deg)}
body.deep-sleep .zzz{font-size:130%}
body.deep-sleep .zzz.z3{font-size:150%}
/* ehmatusega ärkamine */
body.startle .hero-art{animation:startleHop .6s cubic-bezier(.3,1.8,.5,1)}
@keyframes startleHop{0%{transform:translateY(0)}35%{transform:translateY(-18px) scale(1.05)}100%{transform:translateY(0)}}
/* haigutus */
#mouth-sleep{transform-box:fill-box;transform-origin:center}
body.yawning #mouth-sleep{animation:yawnMouth 1.6s ease}
@keyframes yawnMouth{0%,100%{transform:scale(1)}40%,60%{transform:scale(2.6)}}
body.yawning #bee{animation:yawnStretch 1.6s ease}
@keyframes yawnStretch{0%,100%{transform:translateY(10px) rotate(-6deg)}40%,60%{transform:translateY(4px) rotate(-2deg) scale(1.035)}}
@media (prefers-reduced-motion:reduce){
  body.dancing.dance-rock #head-g,body.dancing.dance-classical #wing-l,body.dancing.dance-classical #wing-r,
  body.dancing.dance-folk #bee,body.startle .hero-art,body.yawning #mouth-sleep,body.yawning #bee{animation:none}
  #eyes-open{transition:none}
}

/* ================= EESTI PÜHAD ================= */
#bonfire,#evflag{display:none}
body.jaanipaev #bonfire{display:block}
body.ev24 #evflag{display:block}
body.ev24 #radio-ant{display:none}
.flame{transform-box:fill-box;transform-origin:50% 100%}
body.jaanipaev .flame.f1{animation:flick .5s ease-in-out infinite alternate}
body.jaanipaev .flame.f2{animation:flick .38s ease-in-out .15s infinite alternate}
body.jaanipaev .flame.f3{animation:flick .6s ease-in-out .3s infinite alternate}
@keyframes flick{from{transform:scaleY(1) scaleX(1)}to{transform:scaleY(1.18) scaleX(.92)}}
body.jaanipaev .spark{animation:sparkUp 1.4s ease-out infinite}
body.jaanipaev .spark.s2{animation-delay:.5s}
body.jaanipaev .spark.s3{animation-delay:.9s}
@keyframes sparkUp{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
.flag{transform-box:fill-box;transform-origin:left center}
body.ev24 .flag{animation:flagWave 1.8s ease-in-out infinite}
@keyframes flagWave{0%,100%{transform:skewY(0deg)}50%{transform:skewY(-6deg)}}
@media (prefers-reduced-motion:reduce){
  body.jaanipaev .flame,body.jaanipaev .spark,body.ev24 .flag{animation:none}
  body.jaanipaev .spark{opacity:.7}
}

/* ================= KELLAAJA TERVITUS ================= */
.hero{position:relative}
.greet-bubble{
  position:absolute;top:6px;left:50%;transform:translateX(-50%) scale(.6);
  background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:16px;
  font-family:'Baloo 2',cursive;font-weight:700;font-size:1rem;padding:8px 16px;
  box-shadow:0 4px 0 rgba(0,0,0,.15);white-space:nowrap;pointer-events:none;z-index:3;
  opacity:0;transition:opacity .25s ease, transform .25s cubic-bezier(.3,1.6,.5,1);
}
.greet-bubble::after{
  content:'';position:absolute;bottom:-11px;left:50%;transform:translateX(-50%);
  border:8px solid transparent;border-top-color:var(--ink);border-bottom:0;
}
.greet-bubble::before{
  content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);
  border:6px solid transparent;border-top-color:var(--paper);border-bottom:0;z-index:1;
}
.greet-bubble.show{opacity:1;transform:translateX(-50%) scale(1)}
@media (prefers-reduced-motion:reduce){.greet-bubble{transition:opacity .25s ease}}

/* ================= FAVICON-SÜNK, PILGUTUS, MUTE, SÜDA ================= */
/* pilgutus: hetkeline, ilma viivituseta */
body.blink #eyes-open{opacity:0!important;transition:none!important}
body.blink #eyes-closed{opacity:1!important;transition:none!important}
/* hääletu: pahur nägu + tiivad kõrvadel */
body.muted #wing-l,body.muted #wing-r{animation:none!important;transition:transform .35s ease!important}
body.muted #wing-l{transform:rotate(44deg)!important}
body.muted #wing-r{transform:rotate(-44deg)!important}
body.muted #mouth-smile{opacity:0!important}
body.muted #mouth-angry{opacity:1!important}
/* lendav süda */
.fly-heart{
  position:fixed;font-size:18px;color:#E4573D;pointer-events:none;z-index:30;
  animation:flyheart .9s ease-out forwards;
}
@keyframes flyheart{
  0%{opacity:1;transform:translate(-50%,0) scale(.7)}
  100%{opacity:0;transform:translate(-50%,-46px) scale(1.5)}
}
@media (prefers-reduced-motion:reduce){.fly-heart{animation-duration:.4s}}

/* ================= PÄISENUPUD: kitsal ekraanil ikoonid ================= */
.tb-btn,a.tb-btn,button.tb-btn{display:inline-flex;align-items:center;gap:8px}
.tb-ic{display:grid;place-items:center}
.tb-ic svg{width:20px;height:20px;display:block}
@media (max-width:640px){
  .tb-txt{display:none}
  .tb-btn,a.tb-btn,button.tb-btn{width:44px;height:44px;padding:0;border-radius:50%;justify-content:center;flex:none}
}

/* ================= YOUTUBE KANAL ================= */
#ytSection{margin-top:26px}
.yt-badge{background:#F6D0C4}
.yt-meta{display:block;font-size:.78rem;font-weight:700;color:var(--ink-soft);margin-top:2px}
.card.yt-card.playing .yt-meta{color:var(--honey)}
body.dark .card.yt-card.playing .yt-meta{color:#241B04}
.yt-box{max-width:960px;margin:0 auto;padding:16px 20px 0;box-sizing:border-box}
.yt-frame-wrap{
  width:150px;max-width:40vw;border-radius:14px;overflow:hidden;
  border:3px solid var(--ink);position:relative;background:#000;
}
.yt-frame-wrap::before{content:'';display:block;padding-top:56.25%}
#ytFrame{position:absolute;inset:0;width:100%;height:100%;border:0}
.player.yt-active .fav-btn{display:none}

/* ================= JAAMADE TERVISEKONTROLL ================= */
.card.offline{opacity:.55}
.card.offline .badge{filter:grayscale(1)}
.offline-tag{display:none}
.card.offline .offline-tag{
  display:block;font-size:.72rem;font-weight:800;color:#B23A2E;margin-top:2px;
}
body.dark .card.offline .offline-tag{color:#F0A99E}
</style>
</head>

/* ================= PLEIERI KÕRGUSEGA KOHANDUV RUUM ================= */
/* Pleier võib olla erineva kõrgusega (loo nimi, YouTube'i video-eelvaade) —
   jälgin tema tegelikku kõrgust ja jätan lehe alla täpselt nii palju ruumi.
   ResizeObserver+MutationObserver katavad enamiku juhte kohe, aga YouTube'i
   iframe võib kõrgust muuta ka veidi hiljem (võrgu/fondi laadimine) — seepärast
   on lisaks pidev, väikese vahega taustakontroll niikaua kui pleier on lahti. */
function syncPlayerSpace(){
  document.body.style.paddingBottom = player.classList.contains('open')
    ? (player.offsetHeight + 40) + 'px'
    : '';
}
if ('ResizeObserver' in window){
  new ResizeObserver(syncPlayerSpace).observe(player);
} else {
  window.addEventListener('resize', syncPlayerSpace);
}
new MutationObserver(syncPlayerSpace).observe(player, {attributes:true, attributeFilter:['class']});
setInterval(syncPlayerSpace, 400);
syncPlayerSpace();

function urlOf(name){

/* ---------- kaardi loomine ---------- */
function esc(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function makeCard([name,url]){
  const card = document.createElement('button');
  card.className = 'card' + (isCustom(name) ? ' custom' : '');
  card.type = 'button';
  card.dataset.name = name;
  card.setAttribute('aria-label', 'Mängi: ' + name);
  const g = GENRE[name] || 'custom';
  const safe = esc(name);
  card.innerHTML =
    '<span class="badge" style="background:'+GCOLOR[g]+'">'+GICON[g]+'</span>' +
    '<span><span class="name">'+safe+'</span>' +
    '<span class="eq" aria-hidden="true"><span></span><span></span><span></span></span></span>' +
    (isCustom(name)
      ? '<span class="del-btn" role="button" tabindex="0" aria-label="Kustuta kanal: '+safe+'">' +
        '<svg viewBox="0 0 18 18"><path d="M4 4l10 10M14 4L4 14" fill="none"/></svg></span>'
      : '') +
    '<span class="fav-btn" role="button" tabindex="0" aria-label="Lemmik: '+safe+'">' +
      '<svg viewBox="0 0 24 24"><path class="heart" d="M12 20.5C7 16.5 3 13.2 3 9.3 3 6.4 5.2 4.5 7.7 4.5c1.7 0 3.2.9 4.3 2.4 1.1-1.5 2.6-2.4 4.3-2.4 2.5 0 4.7 1.9 4.7 4.8 0 3.9-4 7.2-9 11.2z"/></svg>' +
    '</span>';
  const delBtn = card.querySelector('.del-btn');
  if (delBtn){
    delBtn.addEventListener('click', e => { e.stopPropagation(); removeCustom(name); });
    delBtn.addEventListener('keydown', e => {
      if(e.key==='Enter'||e.key===' '){ e.preventDefault(); e.stopPropagation(); removeCustom(name); }
    });
  }
  const favBtn = card.querySelector('.fav-btn');
  if (favs.includes(name)) favBtn.classList.add('on');
  favBtn.addEventListener('click', e => { e.stopPropagation(); toggleFav(name); });
  favBtn.addEventListener('keydown', e => {
    if(e.key==='Enter'||e.key===' '){ e.preventDefault(); e.stopPropagation(); toggleFav(name); }
  });
  card.addEventListener('click', () => {
    if (current === name) togglePlay();
    else playStation(name);
  });
  return card;
}

/* ---------- renderdamine ---------- */
function render(){
  const q = searchEl.value.trim().toLowerCase();
  const match = ([n]) => n.toLowerCase().includes(q);

  const sortEt = (a, b) => a[0].localeCompare(b[0], 'et');

  favGrid.innerHTML = '';
  const favList = allStations().filter(([n]) => favs.includes(n)).filter(match).sort(sortEt);
  favList.forEach(s => favGrid.appendChild(makeCard(s)));
  favCount.textContent = favs.length;
  favSection.hidden = favs.length === 0;

  allGrid.innerHTML = '';
  const allList = allStations().filter(match).sort(sortEt);
  allList.forEach(s => allGrid.appendChild(makeCard(s)));
  allCount.textContent = allList.length;

  // nimekiri on nähtav, kui nuppu on vajutatud VÕI otsing käib
  const show = allVisible || q.length > 0;
  allGrid.hidden = !show;
  toggleAllBtn.textContent = show ? 'Peida kanalid' : 'Näita kanaleid';
  toggleAllBtn.setAttribute('aria-expanded', show);

  markPlaying();
  applyOfflineMarks();
}

function markPlaying(){
  document.querySelectorAll('.card').forEach(c => {
    c.classList.toggle('playing', playing && c.dataset.name === current);
  });
  playerFav.classList.toggle('on', current !== null && favs.includes(current));
}

/* ---------- lemmikud ---------- */
function toggleFav(name){
  favs = favs.includes(name) ? favs.filter(f => f !== name) : [...favs, name];
  saveFavs(favs);
  render();
}

/* ---------- mängimine ---------- */
function playStation(name){
  exitYouTube();
  current = name;
  updateXmas(name);
  setDanceStyle(name);
  try{ history.replaceState(null, '', '#jaam=' + encodeURIComponent(name)); }catch(e){}
  nowTitle.textContent = name;
  nowStatus.textContent = 'Ühendan…';
  nowStatus.classList.remove('err');
  nowTrack.hidden = true;
  nowTrack.textContent = '';
  player.classList.add('open','loading');
  audio.src = urlOf(name);
  audio.play().catch(err => {
    if (err.name === 'NotAllowedError'){
      player.classList.remove('loading');
      nowStatus.textContent = 'Autostart blokeeritud — vajuta ▶';
      nowStatus.classList.remove('err');
    } else if (err.name !== 'AbortError') streamError();
  });
  markPlaying();
}

function togglePlay(){
  if (ytMode){
    if (!ytPlayer) return;
    if (playing) ytPlayer.pauseVideo(); else ytPlayer.playVideo();
    return;
  }
  if (!current) return;
  if (playing){ audio.pause(); }
  else {
    player.classList.add('loading');
    nowStatus.textContent = 'Ühendan…';
    nowStatus.classList.remove('err');
    if (!audio.src) audio.src = urlOf(current);
    audio.play().catch(err => { if (err.name !== 'AbortError') streamError(); });
  }
}

function streamError(){
  playing = false;
  document.body.classList.add('oops');

  player.classList.remove('loading');
  nowStatus.textContent = 'Kanal ei vasta — proovi mõnda teist.';

  setIcon(false);

}

/* ---------- loo nimi (kliendipoolne, ainult CORS-iga serverid) ---------- */
const NOWPLAYING = {
  'doubleclap':          {type:'radioco',  id:'scfd7273b2'},
  'finest fm':           {type:'radioco',  id:'sadb37cbdb'},
  'ruut fm':             {type:'azura',    base:'https://a1.asurahosting.com',      station:'ruut_fm'},
  'hps bassline':        {type:'azura',    base:'https://azura.hpsbassline.club',   station:'haapsaly_bassline'},
  'hardcore predictor':  {type:'azura',    base:'https://azura.hpsbassline.club',   station:'hardcore_predictorfm'},
  'tunitemusic':         {type:'radiojar', id:'6x51bmzpfy3vv'},
  'ring fm':             {type:'icecast',  base:'https://cdn.treraadio.ee',         mount:'/ringfm'},
  'tre raadio':          {type:'icecast',  base:'https://cdn.treraadio.ee',         mount:'/pohja-tre'}
};

let trackTimer = null;
let trackFetchSeq = 0;

async function fetchTrack(name){
  const cfg = NOWPLAYING[name];
  if (!cfg) return null;
  try{
    if (cfg.type === 'radioco'){
      const r = await fetch('https://public.radio.co/stations/' + cfg.id + '/status');
      const d = await r.json();
      return (d.current_track && d.current_track.title) || null;
    }
    if (cfg.type === 'azura'){
      const r = await fetch(cfg.base + '/api/nowplaying/' + cfg.station);
      const d = await r.json();
      return (d.now_playing && d.now_playing.song && d.now_playing.song.text) || null;
    }
    if (cfg.type === 'radiojar'){
      const r = await fetch('https://www.radiojar.com/api/stations/' + cfg.id + '/now_playing/');
      const d = await r.json();
      if (d.artist && d.title) return d.artist + ' - ' + d.title;
      return d.title || null;
    }
    if (cfg.type === 'icecast'){
      const r = await fetch(cfg.base + '/status-json.xsl');
      const d = await r.json();
      let srcs = d.icestats && d.icestats.source;
      if (!srcs) return null;
      if (!Array.isArray(srcs)) srcs = [srcs];
      const s = srcs.find(x => (x.listenurl || '').endsWith(cfg.mount));
      return s ? (s.title || s.yp_currently_playing || null) : null;
    }
  }catch(e){ /* võrguviga või blokk — lihtsalt ei näita */ }
  return null;
}

async function updateTrack(){
  const seq = ++trackFetchSeq;
  const name = current;
  const title = name ? await fetchTrack(name) : null;
  // vahepeal võis kanal vahetuda — vana vastus visatakse minema
  if (seq !== trackFetchSeq || name !== current) return;
  const clean = title && title.trim();
  nowTrack.hidden = !clean;
  nowTrack.textContent = clean || '';
  if (clean && 'mediaSession' in navigator){
    navigator.mediaSession.metadata = new MediaMetadata({
      title: clean, artist: current
    });
  }
}

function startTrackPolling(){
  stopTrackPolling();
  nowTrack.hidden = true;
  nowTrack.textContent = '';
  if (!current) return;
  if (NOWPLAYING[current]){
    updateTrack();
    trackTimer = setInterval(updateTrack, 20000);
    return;
  }
  // live-pollimist pole seadistatud — näitan status.json-i viimati teada olnud lugu, kui leidub
  const snap = statusTracks[current];
  if (snap){
    nowTrack.hidden = false;
    nowTrack.textContent = snap;
  }
}
function stopTrackPolling(){
  if (trackTimer){ clearInterval(trackTimer); trackTimer = null; }
}

audio.addEventListener('playing', () => {

  player.classList.remove('loading');
  nowStatus.textContent = 'Otse-eetris';

  markPlaying();
  startTrackPolling();
});
audio.addEventListener('pause', () => {
  playing = false;
  if (!nowStatus.classList.contains('err')) nowStatus.textContent = 'Paus';

});
audio.addEventListener('error', () => { if (current) streamError(); });

function openModal(){

  stUrl.value = '';

  stName.focus();

function closeModal(){
  modalBack.hidden = true;

function addCustom(){
  const name = stName.value.trim();
  let url = stUrl.value.trim();
  if (!name){ modalErr.textContent = 'Pane kanalile nimi.'; stName.focus(); return; }
  if (!url){ modalErr.textContent = 'Striimi URL on puudu.'; stUrl.focus(); return; }
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  try{ new URL(url); }
  catch(e){ modalErr.textContent = 'See ei paista korrektne URL olevat.'; stUrl.focus(); return; }
  if (location.protocol === 'https:' && url.startsWith('http://')){
    modalErr.textContent = 'HTTPS-lehel saab mängida ainult https:// striime.';
    stUrl.focus(); return;
  }
  if (allStations().some(([n]) => n.toLowerCase() === name.toLowerCase())){
    modalErr.textContent = 'Sellenimeline kanal on juba olemas.';
    stName.focus(); return;
  }
  custom = [...custom, [name, url]];
  saveCustom(custom);
  if (!allVisible){ allVisible = true; saveAllVisible(true); }  // et uus kanal oleks näha
  closeModal();
  render();
  playStation(name);   // proovime kohe — nii on kuulda, kas striim töötab
}
function removeCustom(name){
  if (!confirm('Kustutan kanali \u201E' + name + '\u201C?')) return;
  custom = custom.filter(([n]) => n !== name);
  saveCustom(custom);
  if (favs.includes(name)){
    favs = favs.filter(f => f !== name);
    saveFavs(favs);
  }
  if (current === name){
    audio.pause();
    audio.removeAttribute('src');
    current = null;
    player.classList.remove('open','loading');
  }
  render();
}

  if (ytPlayer.setLoop) ytPlayer.setLoop(true);
  if (ytPlayer.setVolume) ytPlayer.setVolume(Math.round((audio.volume || 1) * 100));
  const list = ytPlayer.getPlaylist && ytPlayer.getPlaylist();
  if (list && list.length){
    ytPlayer.playVideoAt(Math.floor(Math.random() * list.length));   // avab suvalise loo
  } else if (ytPendingPlay){
    ytPlayer.playVideo();
  }
  ytPendingPlay = false;
}

function ytOnStateChange(e){
  const S = window.YT.PlayerState;
  if (e.data === S.PLAYING){
    clearTimeout(ytWatchdog);
    playing = true;
    player.classList.remove('loading');
    nowStatus.textContent = 'YouTube · esitusloend';
    nowStatus.classList.remove('err');
    const vd = ytPlayer.getVideoData && ytPlayer.getVideoData();
    ytVideoTitle = (vd && vd.title) || '';
    nowTrack.hidden = !ytVideoTitle;
    nowTrack.textContent = ytVideoTitle;
    if ('mediaSession' in navigator){
      navigator.mediaSession.metadata = new MediaMetadata({
        title: ytVideoTitle || YT_CHANNEL_NAME, artist: 'YouTube · esitusloend'
      });
    }
    setIcon(true);
    markPlaying();
  } else if (e.data === S.PAUSED){
    playing = false;
    if (!nowStatus.classList.contains('err')) nowStatus.textContent = 'Paus';
    setIcon(false);
    markPlaying();
  } else if (e.data === S.BUFFERING){
    player.classList.add('loading');
  } else if (e.data === S.ENDED){
    ytPlayer.nextVideo();
  }
}

function ytOnError(){
  document.body.classList.add('oops');
  setTimeout(() => document.body.classList.remove('oops'), 1600);
  nowStatus.textContent = 'Video ei ole saadaval — liigun edasi…';
  nowStatus.classList.add('err');
  if (ytPlayer) ytPlayer.nextVideo();
}

function createYtPlayer(){
  ytPlayer = new YT.Player('ytFrame', {
    host: 'https://www.youtube-nocookie.com',
    playerVars: { listType: 'playlist', list: YT_PLAYLIST_ID, autoplay: 0, loop: 1, playsinline: 1, rel: 0, modestbranding: 1, origin: location.origin },
    events: { onReady: ytOnReady, onStateChange: ytOnStateChange, onError: ytOnError }
  });
}

function playYouTube(){
  if (!ytMode){ audio.pause(); stopTrackPolling(); }
  ytMode = true;
  current = YT_SENTINEL;
  document.body.classList.remove(...DANCE_CLASSES);
  updateXmas(null);
  try{ history.replaceState(null, '', '#jaam=youtube'); }catch(e){}
  player.classList.add('open', 'loading', 'yt-active');
  ytBox.hidden = false;
  nowTitle.textContent = YT_CHANNEL_NAME;
  nowStatus.textContent = 'Ühendan…';
  nowStatus.classList.remove('err');
  nowTrack.hidden = true;
  nowTrack.textContent = '';
  startYtWatchdog();
  if (ytPlayer) ytPlayer.playVideo();
  else { ytPendingPlay = true; ensureYouTubeAPI(createYtPlayer); }
  markPlaying();
}

function exitYouTube(){
  if (!ytMode) return;
  ytMode = false;
  if (ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo();
  ytBox.hidden = true;
  player.classList.remove('yt-active');
  clearTimeout(ytWatchdog);
}

ytCard.addEventListener('click', () => { ytMode ? togglePlay() : playYouTube(); });


/* ================= JAAMADE TERVISEKONTROLL ================= */
/* status.json kirjutab .github/workflows/station-healthcheck.yml iga päev.
   Jaam märgitakse "maas" alles pärast mitut järjestikust ebaõnnestunud
   kontrolli (vt scripts/check_stations.py), et vältida vale-alarme. */
let offlineStations = new Set();
let statusTracks = {};

function applyOfflineMarks(){
  if (!offlineStations.size) return;
  document.querySelectorAll('.card').forEach(c => {
    if (!offlineStations.has(c.dataset.name)) return;
    c.classList.add('offline');
    if (!c.querySelector('.offline-tag')){
      const tag = document.createElement('span');
      tag.className = 'offline-tag';
      tag.textContent = 'Hetkel maas';
      const nameEl = c.querySelector('.name');
      if (nameEl) nameEl.insertAdjacentElement('afterend', tag);
    }
  });
}


fetch('status.json', {cache: 'no-store'})
  .then(r => r.ok ? r.json() : null)
  .then(data => {
    if (!data || !data.stations) return;
    offlineStations = new Set(Object.keys(data.stations).filter(n => !data.stations[n].ok));
    applyOfflineMarks();
    for (const [name, info] of Object.entries(data.stations)){
      if (info.track) statusTracks[name] = info.track;
    }
    if (current && !NOWPLAYING[current] && statusTracks[current] && nowTrack.hidden){
      nowTrack.hidden = false;
      nowTrack.textContent = statusTracks[current];
    }
  })
  .catch(() => {});

render();
